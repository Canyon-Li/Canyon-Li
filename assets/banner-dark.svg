<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" fill="none" role="img" aria-label="Canyon-Li — AI Agent Developer">
  <defs>
    <pattern id="dot-a" width="29" height="29" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.7" fill="#b7a8da" opacity="0.16"/>
    </pattern>
    <pattern id="dot-b" width="37" height="37" patternUnits="userSpaceOnUse">
      <circle cx="29" cy="11" r="1.7" fill="#d9c069" opacity="0.22"/>
    </pattern>
    <clipPath id="card">
      <rect x="3" y="3" width="1180" height="276" rx="26"/>
    </clipPath>
  </defs>

  <!-- hard offset shadow, then the card itself -->
  <rect x="17" y="19" width="1180" height="276" rx="26" fill="#b7a8da"/>
  <rect x="3" y="3" width="1180" height="276" rx="26" fill="#262019" stroke="#eee6d8" stroke-width="3"/>

  <g clip-path="url(#card)">
    <rect x="3" y="3" width="1180" height="276" fill="url(#dot-a)"/>
    <rect x="3" y="3" width="1180" height="276" fill="url(#dot-b)"/>
  </g>

  <!-- label pill, tilted a touch, with its own hard shadow -->
  <g transform="rotate(-1.5 64 64)">
    <rect x="67" y="49" width="228" height="36" rx="7" fill="#eee6d8"/>
    <rect x="64" y="46" width="228" height="36" rx="7" fill="#453c22" stroke="#eee6d8" stroke-width="2"/>
    <text x="178" y="70" text-anchor="middle" font-family='"Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif' font-size="16" font-weight="700" fill="#eee6d8" letter-spacing="0.6">AI Agent Developer</text>
  </g>

  <circle cx="1075" cy="64" r="5.5" fill="none" stroke="#eee6d8" stroke-width="2.5"/><circle cx="1095" cy="64" r="5.5" fill="none" stroke="#eee6d8" stroke-width="2.5"/><circle cx="1115" cy="64" r="5.5" fill="none" stroke="#eee6d8" stroke-width="2.5"/>

  <line x1="64" y1="102" x2="1119" y2="102" stroke="#4a4234" stroke-width="2" stroke-dasharray="9 8"/>

  <text x="64" y="196" font-family='"Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif' font-size="74" font-weight="800" fill="#eee6d8" letter-spacing="-1.5">Canyon-Li</text>
  <text x="64" y="244" font-family='"Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif' font-size="21" fill="#a89e8d">Python / TypeScript · Building Peregrine</text>
</svg>
